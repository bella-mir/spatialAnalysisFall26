# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
  workflow_dispatch:
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.13
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Activate virtual environment
        # Put .venv on PATH so MyST can find `jupyter` and the python3 kernel
        run: |
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check Jupyter kernel
        run: |
          which jupyter
          jupyter kernelspec list
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install MyST
        run: npm install -g mystmd
      - name: Restore MyST notebook execution cache
        uses: actions/cache@v4
        with:
          path: _build/execute
          key: myst-execute-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('notebooks/**/*.ipynb', 'notebooks/**/*.md', 'myst.yml') }}
          # MyST caches each notebook by the hash of its code cells, so restoring
          # an older cache re-executes only the notebooks that changed.
          restore-keys: |
            myst-execute-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
      - name: Restore OSMnx response cache
        uses: actions/cache@v4
        with:
          path: cache
          key: osmnx-${{ runner.os }}-${{ hashFiles('notebooks/module_1/spData_4.ipynb') }}
          restore-keys: |
            osmnx-${{ runner.os }}-
      - name: Build HTML Assets
        run: myst build --html --execute --execute-parallel 1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
